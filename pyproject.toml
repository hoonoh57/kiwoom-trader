# kiwoom-trader (DESIGN.md 2, 5)

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwoom-trader"
version = "0.0.1"
description = "Kiwoom REST/WS auto-trading tool with 5-axis unit architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["server"]
include = ["kt*"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
